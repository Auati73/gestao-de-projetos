<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Projetos e Atividades</title>
<style>
  :root{
    --bg:#2b2f36; --panel:#353a43; --line:#454b56; --line2:#3d434d;
    --text:#e8ecf2; --muted:#9aa4b4; --accent:#5b9bff; --accent-d:#3f7fe8;
    --ok:#3ecf8e; --okbg:#1f3b31; --warn:#e0a44a; --warnbg:#3d3423;
    --dan:#f2726e; --danbg:#3d2626; --info:#5b9bff; --infobg:#25324a;
    --radius:10px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  h1,h2,h3{margin:0}
  a{color:var(--accent)}
  .muted{color:var(--muted);font-size:12.5px}
  .tiny{font-size:11.5px}

  /* ---------- topo ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
          padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar h1{font-size:17px;letter-spacing:.1px}
  .topbar .grow{flex:1}
  .brand{cursor:pointer}
  .brand:hover h1{color:var(--accent)}

  /* ---------- botões ---------- */
  .btn{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;
       background:var(--panel);color:var(--text);white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn-primary:hover{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
  .btn-sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
  .btn-danger:hover{border-color:var(--dan);color:var(--dan)}

  /* ---------- layout ---------- */
  .wrap{padding:18px 20px 80px;max-width:1400px;margin:0 auto}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
  .two{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
  .card .label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;
               letter-spacing:.6px;margin-bottom:5px}
  .card strong{font-size:21px;font-weight:700}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
  .panel>header{padding:12px 15px;border-bottom:1px solid var(--line2);display:flex;
                align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .panel>header h3{font-size:14px}
  .panel .body{padding:14px 15px}
  .panel .body.p0{padding:0}
  .section-title{font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:9px}
  .bar-title{width:4px;height:16px;border-radius:2px;background:var(--accent)}

  /* ---------- tabelas ---------- */
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:var(--muted);
     white-space:nowrap;background:#3b414b;cursor:pointer;user-select:none}
  th.nosort{cursor:default}
  tbody tr:hover{background:#3d434d}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.act{text-align:right;white-space:nowrap}

  /* ---------- badges ---------- */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
         border:1px solid transparent;white-space:nowrap}
  .b-a-iniciar{color:#c3cbd8;background:#41474f;border-color:#515863}
  .b-em-andamento{color:var(--info);background:var(--infobg);border-color:#cfe0ff}
  .b-concluído{color:var(--ok);background:var(--okbg);border-color:#c9ecd9}
  .b-em-risco{color:#b0341f;background:var(--danbg);border-color:#f8d5d0}
  .b-atrasado{color:#b0341f;background:var(--danbg);border-color:#f8d5d0}
  .b-concluída{color:var(--ok);background:var(--okbg);border-color:#c9ecd9}
  .b-por-fazer{color:#c3cbd8;background:#41474f;border-color:#515863}
  .b-cancelado{color:#9aa4b4;background:#3d434d;border-color:#4a515c}
  .p-Crítica{color:#c22626;font-weight:700}
  .p-Alta{color:#a9660a;font-weight:600}
  .p-Média{color:var(--muted)}
  .p-Baixa{color:#8b95a6}
  .pago{color:var(--ok);font-weight:600}
  .falta{color:var(--dan);font-weight:600}
  .neg{color:var(--dan)}

  /* ---------- barras ---------- */
  .bar{display:inline-block;vertical-align:middle;background:#454b56;border-radius:999px;
       height:8px;width:96px;overflow:hidden}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,#2f6feb,#37c1a0)}
  .bar.warn>span{background:linear-gradient(90deg,#e0a02a,#d63b3b)}
  .bar.ok>span{background:linear-gradient(90deg,#12965d,#37c1a0)}
  .bar-wrap{display:flex;align-items:center;gap:8px}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:13px}
  input,select,textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);
        border-radius:8px;padding:7px 10px;font:inherit;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .toolbar input,.toolbar select{width:auto}
  .f-search{flex:1 1 210px;min-width:150px}

  /* ---------- formulários ---------- */
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px}
  label input,label select,label textarea{margin-top:4px}
  .row{display:flex;gap:11px;flex-wrap:wrap}
  .row>label{flex:1 1 150px;min-width:130px}
  fieldset{border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin:0 0 13px}
  legend{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:0 6px}

  dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--text);
         padding:19px;width:min(760px,95vw);max-height:92vh;overflow-y:auto}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h2{font-size:17px;margin-bottom:14px}
  menu{display:flex;justify-content:flex-end;gap:9px;margin:16px 0 0;padding:0;flex-wrap:wrap}

  /* ---------- alertas ---------- */
  .alert{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:9px;
         font-size:13.5px;margin-bottom:8px;border:1px solid;line-height:1.5}
  /* texto principal do alerta — claro e com peso, para ler à distância */
  .alert-a{background:var(--danbg);border-color:#6b3a37;color:#ffc9c5}
  .alert-w{background:var(--warnbg);border-color:#6b5730;color:#ffdfa8}
  .alert-i{background:var(--infobg);border-color:#3a4c72;color:#c3d8ff}
  .alert strong{font-weight:700;color:#fff;font-size:14px}
  .alert .det{font-weight:500}
  /* o resto do texto (prazo, projeto, ligação) fica secundário mas bem legível */
  .alert .muted,.alert small{color:currentColor;opacity:.82;font-size:12.5px}
  .alert a{color:inherit;text-decoration:underline;font-weight:600;cursor:pointer;opacity:.95}
  .alert a:hover{opacity:1;color:#fff}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:5px;background:currentColor;
       box-shadow:0 0 0 3px rgba(255,255,255,.07)}

  /* ---------- gráficos ---------- */
  .charts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
  .chart-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
  .chart-box h4{margin:0 0 10px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px;font-size:12px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .swatch{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* ---------- navegação de páginas ---------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:8px 14px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;
       cursor:pointer;font-size:13.5px;color:var(--muted);background:transparent}
  .tab:hover{color:var(--accent)}
  .tab.on{background:var(--panel);border-color:var(--line);color:var(--text);font-weight:600;
          margin-bottom:-1px;border-bottom:1px solid var(--panel)}
  .kpi-mini{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
  .crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-bottom:10px}
  .crumb a{cursor:pointer;text-decoration:none}
  .crumb a:hover{text-decoration:underline}

  /* ---------- relatório ---------- */
  .report{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;max-width:960px}
  .report h2{font-size:21px;margin-bottom:4px}
  .report h3{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
             margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
  .report table{margin-top:6px}
  .report th,.report td{padding:7px 10px}
  .report .head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
                border-bottom:2px solid var(--accent);padding-bottom:12px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13.5px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;font-weight:600}

  .empty{padding:26px;text-align:center;color:var(--muted)}
  .pill{display:inline-block;background:#3d434d;border:1px solid var(--line2);border-radius:6px;
        padding:1px 7px;font-size:11.5px;color:var(--muted)}

  @media (max-width:700px){
    .wrap{padding:13px}
    .topbar{padding:10px 13px}
    dialog{padding:15px}
    .report{padding:18px}
  }
  @media print{
    body{background:#fff;color:#1b2231}
    .topbar,.toolbar,.tabs,button,.no-print{display:none !important}
    .report{border:none;padding:0;max-width:none}
    .panel,.chart-box,.card{break-inside:avoid}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" onclick="go('portfolio')">
    <h1>Gestão de Projetos e Atividades</h1>
    <div class="muted tiny" id="topMeta">a carregar…</div>
  </div>
  <div class="grow"></div>
  <button class="btn btn-sm" onclick="exportar()">Exportar</button>
  <button class="btn btn-sm" onclick="document.getElementById('imp').click()">Importar</button>
  <input type="file" id="imp" accept=".json,application/json" hidden onchange="importar(this)">
  <button class="btn btn-sm btn-primary" onclick="novoProjeto()">+ Projeto</button>
</header>

<main class="wrap" id="app"></main>

<!-- =============== MODAL PROJETO =============== -->
<dialog id="dlgProj">
  <form id="frmProj" onsubmit="guardarProjeto(event)">
    <h2 id="tProj">Novo projeto</h2>
    <input type="hidden" id="p-id">
    <div class="row">
      <label>Nome do projeto *<input id="p-nome" required></label>
      <label>Tipo / género<input id="p-tipo" list="tipos" placeholder="ex.: Obra, IT, Consultoria…"></label>
      <datalist id="tipos"></datalist>
    </div>
    <div class="row">
      <label>Gestor / responsável<input id="p-gestor"></label>
      <label>Estado
        <select id="p-estado"><option>A iniciar</option><option>Em andamento</option>
          <option>Concluído</option><option>Em risco</option></select>
      </label>
      <label>Prioridade
        <select id="p-prio"><option>Baixa</option><option>Média</option>
          <option>Alta</option><option>Crítica</option></select>
      </label>
    </div>
    <div class="row">
      <label>Início<input id="p-ini" type="date"></label>
      <label>Fim (baseline)<input id="p-bas" type="date"></label>
      <label>Fim previsto atual<input id="p-fim" type="date"></label>
    </div>
    <fieldset>
      <legend>Financeiro</legend>
      <div class="row">
        <label>Valor contratado (€)<input id="p-contratado" type="number" step="0.01" min="0" value="0"></label>
        <label>Recebido (€)<input id="p-recebido" type="number" step="0.01" min="0" value="0"></label>
        <label>Pago a fornecedores (€)<input id="p-pago" type="number" step="0.01" min="0" value="0"></label>
      </div>
    </fieldset>
    <label>Descrição / âmbito<textarea id="p-desc" rows="3"></textarea></label>
    <menu>
      <button type="button" class="btn" onclick="dlgProj.close()">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </menu>
  </form>
</dialog>

<!-- =============== MODAL TAREFA =============== -->
<dialog id="dlgTask">
  <form id="frmTask" onsubmit="guardarTarefa(event)">
    <h2 id="tTask">Nova tarefa</h2>
    <input type="hidden" id="t-id">
    <input type="hidden" id="t-proj">
    <label>Descrição da tarefa *<input id="t-nome" required></label>
    <div class="row">
      <label>Autor (quem pediu)<input id="t-autor"></label>
      <label>Responsável (quem executa)<input id="t-resp"></label>
      <label>Afetação (%)<input id="t-afet" type="number" min="0" max="100" step="1" value="10"></label>
    </div>
    <div class="row">
      <label>Início<input id="t-ini" type="date"></label>
      <label>Fim<input id="t-fim" type="date"></label>
      <label>Fim baseline<input id="t-bas" type="date"></label>
    </div>
    <div class="row">
      <label>Estado
        <select id="t-estado"><option>Por fazer</option><option>Em curso</option>
          <option>Concluída</option><option>Cancelada</option></select>
      </label>
      <label>Progresso (%)<input id="t-prog" type="number" min="0" max="100" value="0"></label>
      <label>Alerta (dias antes)<input id="t-alerta" type="number" min="0" value="7"></label>
    </div>
    <fieldset>
      <legend>Financeiro da tarefa</legend>
      <div class="row">
        <label>Custo previsto (€)<input id="t-custo" type="number" step="0.01" min="0" value="0"></label>
        <label>Valor pago (€)<input id="t-pago" type="number" step="0.01" min="0" value="0"></label>
        <label>Valor em falta (€)<input id="t-falta" type="number" step="0.01" min="0" value="0"></label>
      </div>
    </fieldset>
    <label>Notas<textarea id="t-notas" rows="2"></textarea></label>
    <menu>
      <button type="button" class="btn" onclick="dlgTask.close()">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </menu>
  </form>
</dialog>

<!-- =============== MODAL PAGAMENTO =============== -->
<dialog id="dlgPag">
  <form id="frmPag" onsubmit="guardarPagamento(event)">
    <h2 id="tPag">Novo movimento</h2>
    <input type="hidden" id="g-id">
    <input type="hidden" id="g-proj">
    <div class="row">
      <label>Direção
        <select id="g-dir">
          <option value="recebido">Recebido (entrada)</option>
          <option value="pago">Pago a fornecedores (saída)</option>
        </select>
      </label>
      <label>Data<input id="g-data" type="date"></label>
      <label>Valor (€)<input id="g-valor" type="number" step="0.01" min="0" required></label>
    </div>
    <div class="row">
      <label>Descrição<input id="g-desc" placeholder="ex.: Autos nº 3, adiantamento…"></label>
      <label>Estado
        <select id="g-estado"><option>Pago</option><option>Em falta</option></select>
      </label>
    </div>
    <menu>
      <button type="button" class="btn" onclick="dlgPag.close()">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </menu>
  </form>
</dialog>

<script>
/* =====================================================================
   GESTÃO DE PROJETOS E ATIVIDADES — aplicação HTML autónoma
   ---------------------------------------------------------------------
   • Dashboard geral (portfólio) + dashboard individual por projeto
   • Dados em localStorage; Exportar/Importar para mover entre máquinas
   • Abre com duplo clique, online (GitHub Pages/Netlify) e no Notion (/embed)
   ===================================================================== */

const KEY = 'gp_dashboard_v1';

/* ------------------------------ utilitários ------------------------------ */
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = (off = 0) => { const d = new Date(); d.setDate(d.getDate() + off); return d.toISOString().slice(0,10); };
const n = v => Number(v) || 0;
const cash = v => new Intl.NumberFormat('pt-PT', {style:'currency', currency:'EUR',
  minimumFractionDigits:2, maximumFractionDigits:2}).format(n(v));
const cash0 = v => new Intl.NumberFormat('pt-PT', {style:'currency', currency:'EUR',
  maximumFractionDigits:0}).format(n(v));
const pc = v => (Math.round(n(v) * 10) / 10) + ' %';
const dpt = s => !s ? '–' : new Date(s + 'T00:00:00').toLocaleDateString('pt-PT');
const slug = s => 'b-' + String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/\s+/g,'-');
const daysBetween = (a, b) => {
  if (!a || !b) return null;
  const d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  if (isNaN(d1) || isNaN(d2)) return null;
  return Math.round((d2 - d1) / 86400000);
};
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };

/* ------------------------------ estado global ------------------------------ */
let DB = { projects: [], tasks: [], payments: [] };
let ROUTE = { page: 'portfolio', projectId: null, tab: 'visao' };
const SORT = { portfolio: {key:'nome', dir:1}, tasks: {key:'fim', dir:1}, finance: {key:'data', dir:-1} };
let FILT = { q:'', estado:'', prio:'', tipo:'' };

/* ------------------------------ persistência ------------------------------ */
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e) { console.warn('Gravação falhou:', e); }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      DB = { projects: parsed.projects || [], tasks: parsed.tasks || [], payments: parsed.payments || [] };
      if (DB.projects.length) return;
    }
  } catch(e) { console.warn('Dados ilegíveis, a repor exemplos.', e); }
  seed();
}
function seed() {
  const A = { id: uid(), nome:'Migração do ERP', tipo:'IT / Sistemas', gestor:'Ana Ribeiro',
    estado:'Em andamento', prioridade:'Alta', inicio:iso(-120), baseline:iso(30), fim:iso(45),
    contratado:120000, recebido:74000, pago:58000,
    descricao:'Substituição do ERP financeiro e integração com a plataforma de dados.' };
  const B = { id: uid(), nome:'Requalificação do Edifício Sede', tipo:'Obra / Construção',
    gestor:'Diogo Matos', estado:'Em risco', prioridade:'Crítica', inicio:iso(-200),
    baseline:iso(-20), fim:iso(-5), contratado:200000, recebido:150000, pago:168000,
    descricao:'Reabilitação integral do edifício sede, incluindo instalações técnicas.' };
  const C = { id: uid(), nome:'Certificação ISO 55001', tipo:'Consultoria', gestor:'Carla Nunes',
    estado:'A iniciar', prioridade:'Média', inicio:iso(15), baseline:iso(210), fim:iso(210),
    contratado:30000, recebido:6000, pago:2500,
    descricao:'Implementação do sistema de gestão de ativos e certificação.' };
  DB.projects = [A, B, C];

  DB.tasks = [
    task(A, 'Levantamento de requisitos', 'Ana Ribeiro', 'Rui Melo', 10, iso(-120), iso(-95), iso(-95), 'Concluída', 100, 8000, 8000, 0),
    task(A, 'Modelação de dados',        'Ana Ribeiro', 'Sofia Reis', 15, iso(-90), iso(-40), iso(-45), 'Concluída', 100, 14000, 14000, 0),
    task(A, 'Migração de dados legados', 'Rui Melo',    'Sofia Reis', 20, iso(-35), iso(10),  iso(5),   'Em curso',  70,  22000, 15000, 7000),
    task(A, 'Formação de utilizadores',  'Ana Ribeiro', 'Nuno Sá',    10, iso(-10), iso(20),  iso(20),  'Em curso',  30,  6000,  1000,  5000),
    task(A, 'Go-live e estabilização',   'Ana Ribeiro', 'Rui Melo',   15, iso(25),  iso(45),  iso(45),  'Por fazer', 0,   9000,  0,     9000),
    task(A, 'Documentação e encerramento','Ana Ribeiro','Sofia Reis',  5,  iso(30),  iso(50),  iso(50),  'Por fazer', 0,   3000,  0,     3000),

    task(B, 'Projeto de execução',      'Diogo Matos', 'Eng.ª Filipa', 10, iso(-200), iso(-175), iso(-175), 'Concluída', 100, 15000, 15000, 0),
    task(B, 'Demolições e estrutura',   'Diogo Matos', 'Construtora',  25, iso(-170), iso(-120), iso(-125), 'Concluída', 100, 45000, 45000, 0),
    task(B, 'Instalações elétricas',    'Diogo Matos', 'EletroSul',    20, iso(-115), iso(-45),  iso(-35),  'Em curso',  65,  38000, 30000, 8000),
    task(B, 'AVAC',                     'Diogo Matos', 'ClimaTec',     15, iso(-60),  iso(5),    iso(-5),   'Em curso',  40,  32000, 12000, 20000),

/* ============================== CÁLCULOS ============================== */

/* tugas de um projeto */
const tasksOf = id => DB.tasks.filter(t => t.projId === id);

/* progresso do projeto = soma das afetações executadas / soma das afetações */
function progressoProjeto(id) {
  const ts = tasksOf(id);
  const totalAfect = ts.reduce((s,t) => s + n(t.afetacao), 0);
  const feito = ts.reduce((s,t) => s + n(t.afetacao) * n(t.progresso) / 100, 0);
  if (totalAfect > 0) return Math.round(feito / totalAfect * 1000) / 10;
  const ativas = ts.filter(t => t.estado === 'Concluída').length;
  return ts.length ? Math.round(ativas / ts.length * 1000) / 10 : 0;
}

/* finanças de um projeto = projeto + tarefas + movimentos registados */
function finProjeto(id) {
  const p = DB.projects.find(x => x.id === id) || {};
  const ts = tasksOf(id);
  const movs = DB.payments.filter(m => m.projId === id);

  const recebido = n(p.recebido) + movs.filter(m => m.dir === 'recebido' && m.estado === 'Pago')
                                          .reduce((s,m) => s + n(m.valor), 0);
  const pago = n(p.pago) + movs.filter(m => m.dir === 'pago' && m.estado === 'Pago')
                               .reduce((s,m) => s + n(m.valor), 0);
  const receberFalta = t.sum(movs.filter(m => m.dir === 'recebido' && m.estado === 'Em falta'), 'valor')
                     + ts.reduce((s,t) => s + n(t.falta), 0);
  const custoPrev = t.sum(ts, 'custo');
  const contratado = n(p.contratado);
  const saldo = recebido - pago;

  return {
    contratado,
    recebido,
    pago,
    saldo,
    aReceber: Math.max(0, contratado - recebido),
    pagoPct: contratado ? Math.round(recebido / contratado * 1000) / 10 : 0,
    recebidoMesmo: movs.filter(m => m.dir === 'recebido' && m.estado === 'Pago')
                       .reduce((s,m) => s + n(m.valor), 0),
    pagoMesmo: movs.filter(m => m.dir === 'pago' && m.estado === 'Pago')
                   .reduce((s,m) => s + n(m.valor), 0),
    emFalta: receberFalta,
    custoPrev,
    custoPago: ts.reduce((s,t) => s + n(t.pago), 0),
    custoFalta: Math.max(custoPrev - ts.reduce((s,t) => s + n(t.pago), 0), 0),
    movimentos: movs
  };
}

/* prazo: compara fim atual com baseline e com hoje */
function prazoProjeto(p) {
  const dl = daysBetween(iso(0), p.fim);
  const desvio = daysBetween(p.baseline, p.fim);
  const concluido = p.estado === 'Concluído';
  return {
    dias: dl,
    desvio,
    atrasado: !concluido && dl !== null && dl < 0,
    aTerminar: !concluido && dl !== null && dl >= 0 && dl <= 14,
    concluido
  };
}

/* alertas de tarefas */
function alertas() {
  const out = [];
  const hoje = iso(0);
  for (const t of DB.tasks) {
    const p = DB.projects.find(x => x.id === t.projId);
    if (!p || t.estado === 'Concluída' || t.estado === 'Cancelada') continue;
    const dias = daysBetween(hoje, t.fim);
    if (dias === null) continue;
    if (dias < 0) out.push({nivel:'a', t, p, dias, txt:`${Math.abs(dias)} dia(s) em atraso`});
    else if (dias <= n(t.alerta || 7)) out.push({nivel:'w', t, p, dias, txt:`termina em ${dias} dia(s)`});
  }
  for (const p of DB.projects) {
    if (p.estado === 'Concluído') continue;
    const z = prazoProjeto(p);
    if (z.atrasado) out.push({nivel:'a', proj:p, dias:z.dias, txt:`Projeto ${Math.abs(z.dias)} dia(s) além do fim previsto`});
    else if (z.aTerminar) out.push({nivel:'w', proj:p, dias:z.dias, txt:`Projeto termina em ${z.dias} dia(s)`});
    if (z.desvio !== null && z.desvio > 0)
      out.push({nivel:'i', proj:p, dias:z.desvio, txt:`Prazo ${z.desvio} dia(s) acima da baseline`});
  }
  const ordem = {a:0, w:1, i:2};
  return out.sort((x,y) => ordem[x.nivel] - ordem[y.nivel]);
}

/* resumo do portfólio */
function resumoPortfolio() {
  const P = DB.projects;
  const r = { total:P.length, aIniciar:0, emAndamento:0, concluido:0, emRisco:0,
              contratado:0, recebido:0, pago:0, aReceber:0, emFalta:0, progresso:0 };
  for (const p of P) {
    const f = finProjeto(p.id);
    if (p.estado === 'A iniciar') r.aIniciar++;
    if (p.estado === 'Em andamento') r.emAndamento++;
    if (p.estado === 'Concluído') r.concluido++;
    if (p.estado === 'Em risco') r.emRisco++;
    r.contratado += f.contratado;
    r.recebido += f.recebido;
    r.pago += f.pago;
    r.aReceber += f.aReceber;
    r.emFalta += f.emFalta;
    r.progresso += progressoProjeto(p.id);
  }
  r.progresso = P.length ? Math.round(r.progresso / P.length * 10) / 10 : 0;
  r.pagoPct = r.contratado ? Math.round(r.recebido / r.contratado * 1000) / 10 : 0;
  r.saldo = r.recebido - r.pago;
  return r;
}

/* pequeno helper de soma */
const t = { sum: (arr, k) => arr.reduce((s,x) => s + n(x[k]), 0) };

/* ============================== GRÁFICOS (SVG) ============================== */
/* Donut: recebido vs em falta (ou execução da carteira) */
function donut(parts, size = 150, espessura = 20) {
  const total = parts.reduce((s,p) => s + n(p.valor), 0);
  const r = (size - espessura) / 2, c = size / 2;
  const per = 2 * Math.PI * r;
  if (total <= 0) {
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#454b56" stroke-width="${espessura}"/>
      <text x="${c}" y="${c+4}" text-anchor="middle" font-size="13" fill="#9aa4b4">sem dados</text></svg>`;
  }
  let off = 0, out = '';
  for (const p of parts) {
    const frac = n(p.valor) / total;
    const len = frac * per;
    out += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${p.cor}"
              stroke-width="${espessura}" stroke-dasharray="${len.toFixed(2)} ${(per-len).toFixed(2)}"
              stroke-dashoffset="${(-off).toFixed(2)}"
              transform="rotate(-90 ${c} ${c})"/>`;
    off += len;
  }
  const pct = Math.round(parts[0].valor / total * 1000) / 10;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    ${out}
    <text x="${c}" y="${c-2}" text-anchor="middle" font-size="22" font-weight="700" fill="#e8ecf2">${pct}%</text>
    <text x="${c}" y="${c+16}" text-anchor="middle" font-size="10.5" fill="#9aa4b4">${esc(parts[0].curto||'')}</text>
  </svg>`;
}

/* Barras horizontais */
function barras(items, largura = 260) {
  if (!items.length) return `<p class="muted">sem dados</p>`;
  const max = Math.max(...items.map(i => n(i.valor)), 1);
  const linha = 30, altura = items.length * linha;
  let out = '';
  items.forEach((it, i) => {
    const y = i * linha;
    const w = Math.max(2, Math.round(n(it.valor) / max * (largura - 120)));
    out += `<text x="0" y="${y+13}" font-size="11.5" fill="#c3cbd8">${esc((it.rotulo||'').slice(0,22))}</text>
      <rect x="0" y="${y+18}" width="${largura-120}" height="7" fill="#454b56" rx="3.5"/>
      <rect x="0" y="${y+18}" width="${w}" height="7" fill="${it.cor||'#2f6feb'}" rx="3.5"/>
      <text x="${largura-114}" y="${y+25}" font-size="11.5" font-weight="600" fill="#e8ecf2">${esc(it.texto)}</text>`;
  });
  return `<svg viewBox="0 0 ${largura} ${altura}" width="100%" height="${altura}" preserveAspectRatio="xMinYMin meet">${out}</svg>`;
}

function filtrarProjetos() {
  const q = FILT.q.trim().toLowerCase();
  let rows = DB.projects.map(p => ({ p, f: finProjeto(p.id), prog: progressoProjeto(p.id),
                                     z: prazoProjeto(p) }));
  if (q) rows = rows.filter(x => (x.p.nome + ' ' + x.p.gestor + ' ' + x.p.tipo).toLowerCase().includes(q));
  if (FILT.estado) rows = rows.filter(x => x.p.estado === FILT.estado);
  const { key, dir } = SORT.portfolio;
  rows.sort((a,b) => {
    const A = valorOrdenacao(a, key), B = valorOrdenacao(b, key);
    if (typeof A === 'string' || typeof B === 'string')
      return String(A ?? '').localeCompare(String(B ?? ''), 'pt') * dir;
    return ((A ?? 0) - (B ?? 0)) * dir;
  });
  return rows;
}
function valorOrdenacao(x, key) {
  if (key === 'nome' || key === 'estado' || key === 'fim') return x.p[key];
  return x.f[key] !== undefined ? x.f[key] : x[key];
}
function linhaProjeto(x) {
  const { p, f, prog, z } = x;
  return `<tr>
    <td><a onclick="irProjeto('${p.id}')"><strong>${esc(p.nome)}</strong></a></td>
    <td><span class="muted">${esc(p.tipo || '–')}</span></td>
    <td>${esc(p.gestor || '–')}</td>
    <td><span class="badge ${slug(p.estado)}">${esc(p.estado)}</span></td>
    <td><div class="bar-wrap"><div class="bar ${prog >= 100 ? 'ok' : ''}" style="width:78px">
      <span style="width:${Math.min(100, prog)}%"></span></div><span>${pc(prog)}</span></div></td>
    <td class="num">${cash0(f.contratado)}</td>
    <td class="num pago">${cash0(f.recebido)}</td>
    <td class="num falta">${cash0(f.aReceber)}</td>
    <td class="num">${pc(f.pagoPct)}</td>
    <td class="${z.atrasado ? 'neg' : ''}">${dpt(p.fim)}
      ${z.atrasado ? `<div class="tiny neg">${Math.abs(z.dias)} d atraso</div>`
        : z.aTerminar ? `<div class="tiny">${z.dias} d</div>` : ''}</td>
    <td class="act">
      <button class="btn btn-sm" onclick="irProjeto('${p.id}')">Abrir</button>
      <button class="btn btn-sm" onclick="editarProjeto('${p.id}')">Editar</button>
      <button class="btn btn-sm btn-danger" onclick="apagarProjeto('${p.id}')">Apagar</button>
    </td></tr>`;
}

function tabelaTarefas(rows, comProjeto) {
  if (!rows.length) return `<p class="empty">Sem tarefas para os filtros escolhidos.</p>`;
  const { key, dir } = SORT.tasks;
  const list = rows.slice().sort((a,b) => {
    const A = a[key], B = b[key];
    if (typeof A === 'string' || typeof B === 'string')
      return String(A ?? '').localeCompare(String(B ?? ''), 'pt') * dir;
    return ((n(A)) - n(B)) * dir;
  });
  return `<table>
    <thead><tr>
      ${comProjeto ? '<th onclick="ordenar(\'tasks\',\'proj\')">Projeto</th>' : ''}
      <th onclick="ordenar('tasks','nome')">Tarefa</th>
      <th class="nosort">Autor</th>
      <th class="nosort">Responsável</th>
      <th onclick="ordenar('tasks','fim')">Prazo</th>
      <th onclick="ordenar('tasks','baseline')">Baseline</th>
      <th onclick="ordenar('tasks','afetacao')" class="num">Afetação</th>
      <th onclick="ordenar('tasks','progresso')">Progresso</th>
      <th class="nosort">Estado</th>
      <th onclick="ordenar('tasks','custo')" class="num">Custo</th>
      <th class="nosort num">Pago</th>
      <th class="nosort num">Em falta</th>
      <th class="nosort"></th>
    </tr></thead>
    <tbody>${list.map(tk => {
      const p = DB.projects.find(x => x.id === tk.projId);
      const dias = daysBetween(iso(0), tk.fim);
      const atrasada = tk.estado !== 'Concluída' && tk.estado !== 'Cancelada' && dias !== null && dias < 0;
      const aTerminar = tk.estado !== 'Concluída' && tk.estado !== 'Cancelada' &&
                        dias !== null && dias >= 0 && dias <= n(tk.alerta || 7);
      const desvioB = daysBetween(tk.baseline, tk.fim);
      return `<tr>
        ${comProjeto ? `<td><a onclick="irProjeto('${tk.projId}','tarefas')">${esc(p ? p.nome : '—')}</a></td>` : ''}
        <td>${esc(tk.nome)}
          ${atrasada ? `<div class="tiny neg">⚠ ${Math.abs(dias)} dia(s) em atraso</div>`
           : aTerminar ? `<div class="tiny" style="color:#b9720f">⏱ termina em ${dias} dia(s)</div>` : ''}</td>
        <td>${esc(tk.autor || '–')}</td>
        <td>${esc(tk.resp || '–')}</td>
        <td class="${atrasada ? 'neg' : ''}">${dpt(tk.fim)}</td>
        <td class="muted">${dpt(tk.baseline)}
          ${desvioB !== null && desvioB > 0 ? `<div class="tiny neg">+${desvioB} d</div>` : ''}</td>
        <td class="num">${pc(tk.afetacao)}</td>
        <td><div class="bar-wrap"><div class="bar ${n(tk.progresso) >= 100 ? 'ok' : ''}" style="width:64px">
          <span style="width:${Math.min(100, n(tk.progresso))}%"></span></div>
          <span>${pc(tk.progresso)}</span></div></td>
        <td><span class="badge ${slug(tk.estado)}">${esc(tk.estado)}</span></td>
        <td class="num">${cash0(tk.custo)}</td>
        <td class="num pago">${cash0(tk.pago)}</td>
        <td class="num ${n(tk.falta) > 0 ? 'falta' : ''}">${cash0(tk.falta)}</td>
        <td class="act">
          <button class="btn btn-sm" onclick="editarTarefa('${tk.id}')">Editar</button>
          <button class="btn btn-sm btn-danger" onclick="apagarTarefa('${tk.id}')">Apagar</button>
        </td></tr>`;
    }).join('')}</tbody>
  </table>`;
}

function tarefasFiltradas() {
  const q = FILT.q.trim().toLowerCase();
  let rows = DB.tasks.slice();
  if (FILT.estado) rows = rows.filter(t => t.estado === FILT.estado);
  if (q) rows = rows.filter(t => {
    const p = DB.projects.find(x => x.id === t.projId);
    return (t.nome + ' ' + t.autor + ' ' + t.resp + ' ' + (p ? p.nome : '')).toLowerCase().includes(q);
  });
  return rows;
}

function ordenar(bloco, key) {
  const s = SORT[bloco];
  SORT[bloco] = { key, dir: s.key === key ? -s.dir : 1 };
  render();
}

/* ============================== PÁGINA 2: PROJETO ============================== */

/* ---------- separador: visão geral ---------- */

      <div class="muted tiny">${ts.filter(t=>t.estado==='Concluída').length} concluídas</div></article>
    <article class="card"><span class="label">Prazo</span><strong class="${z.atrasado ? 'neg' : ''}">
      ${z.dias === null ? '–' : z.dias < 0 ? Math.abs(z.dias) + ' d atraso' : z.dias + ' d'}</strong>
      <div class="muted tiny">fim ${dpt(p.fim)}</div></article>
    <article class="card"><span class="label">Contratado</span><strong>${cash0(f.contratado)}</strong></article>
    <article class="card"><span class="label">Recebido</span><strong class="pago">${cash0(f.recebido)}</strong>
      <div class="muted tiny">${pc(f.pagoPct)} do contratado</div></article>
    <article class="card"><span class="label">Em falta</span><strong class="falta">${cash0(f.aReceber)}</strong></article>
    <article class="card"><span class="label">Saldo</span><strong class="${f.saldo<0?'neg':''}">${cash0(f.saldo)}</strong>
      <div class="muted tiny">recebido − pago</div></article>
  </div>

  ${p.descricao ? `<div class="panel" style="margin-top:14px"><div class="body">
    <span class="label muted tiny">Âmbito</span><p style="margin:4px 0 0">${esc(p.descricao)}</p>
  </div></div>` : ''}

  ${al.length ? `<h2 class="section-title"><span class="bar-title"></span>Alertas deste projeto</h2>
  <div class="panel"><div class="body">
    ${al.map(a => `<div class="alert alert-${a.nivel}"><span class="dot"></span>
      <div><span class="det">${esc(a.proj ? a.proj.nome : a.t.nome)}</span> — <strong>${esc(a.txt)}</strong></div></div>`).join('')}
  </div></div>` : ''}

  <h2 class="section-title"><span class="bar-title"></span>Indicadores gráficos</h2>
  <div class="charts">
    <div class="chart-box"><h4>Execução do projeto</h4>
      ${donut([{valor:prog, cor:'#2f6feb', curto:'executado'},
               {valor:Math.max(100 - prog, 0), cor:'#e6e9ee', curto:''}], 150, 20)}
      <div class="legend"><span><i class="swatch" style="background:#2f6feb"></i>Executado</span>
        <span><i class="swatch" style="background:#e6e9ee"></i>Por executar</span></div>
    </div>
    <div class="chart-box"><h4>Recebido vs. em falta</h4>
      ${donut([{valor:f.recebido, cor:'#12965d', curto:'recebido'},
               {valor:Math.max(f.contratado - f.recebido, 0), cor:'#e6e9ee', curto:''}], 150, 20)}
      <div class="legend">
        <span><i class="swatch" style="background:#12965d"></i>${cash0(f.recebido)}</span>
        <span><i class="swatch" style="background:#e6e9ee"></i>${cash0(Math.max(f.contratado-f.recebido,0))}</span></div>
    </div>
    <div class="chart-box"><h4>Tarefas por estado</h4>
      ${barras(porEstado, 300)}

    <div class="chart-box"><h4>Custo previsto por tarefa (top 6)</h4>
      ${barras(custoPorTarefa, 300)}

  </div>

  <h2 class="section-title"><span class="bar-title"></span>Tarefas críticas / a terminar</h2>
  <div class="panel"><div class="body p0 scroll">
    ${tabelaTarefas(ts.filter(t => {
        if (t.estado === 'Concluída' || t.estado === 'Cancelada') return false;
        const d = daysBetween(iso(0), t.fim);
        return d !== null && d <= 21;
      }), false) || ''}

}

/* ---------- separador: tarefas ---------- */
function tarefasProjeto(p, ts) {
  const totalAfet = ts.reduce((s,t) => s + n(t.afetacao), 0);

      ${totalAfet > 100 ? ' (acima de 100 %)' : ''}</span>

  <div class="panel"><div class="body p0 scroll">
    ${tabelaTarefas(ts, false)}
  </div></div>
  <p class="muted tiny" style="margin-top:10px">
    A <strong>afetação</strong> é o peso de cada tarefa no total do projeto. A execução do projeto é
    calculada somando (afetação × progresso) de todas as tarefas.
  </p>`;
}

      <dt>Estado</dt><dd><span class="badge ${slug(p.estado)}">${esc(p.estado)}</span></dd>
      <dt>Prioridade</dt><dd class="p-${esc(p.prioridade)}">${esc(p.prioridade)}</dd>
      <dt>Período</dt><dd>${dpt(p.inicio)} → ${dpt(p.fim)}</dd>
      <dt>Baseline (fim)</dt><dd>${dpt(p.baseline)}
        ${z.desvio !== null && z.desvio !== 0
          ? ` <span class="${z.desvio > 0 ? 'neg' : 'pago'}">(${z.desvio > 0 ? '+' : ''}${z.desvio} dias)</span>` : ''}</dd>
    </dl>

    <h3>2. Execução e prazos</h3>
    <div class="charts" style="margin-top:8px">
      <div class="chart-box"><h4>Execução</h4>
        ${donut([{valor:prog, cor:'#2f6feb', curto:'executado'},
                 {valor:Math.max(100-prog,0), cor:'#e6e9ee', curto:''}], 140, 19)}
        <div class="legend"><span><i class="swatch" style="background:#2f6feb"></i>Executado ${pc(prog)}</span>
          <span><i class="swatch" style="background:#e6e9ee"></i>Restante ${pc(Math.max(100-prog,0))}</span></div>
      </div>
      <div class="chart-box"><h4>Tarefas</h4>
        ${donut([{valor:concl, cor:'#12965d', curto:'concluídas'},
                 {valor:emCurso, cor:'#2f6feb', curto:''},
                 {valor:Math.max(ts.length-concl-emCurso,0), cor:'#9aa7bb', curto:''}], 140, 19)}
        <div class="legend"><span><i class="swatch" style="background:#12965d"></i>Concluídas ${concl}</span>
          <span><i class="swatch" style="background:#2f6feb"></i>Em curso ${emCurso}</span>
          <span><i class="swatch" style="background:#9aa7bb"></i>Por fazer ${Math.max(ts.length-concl-emCurso,0)}</span></div>
      </div>
      <div class="chart-box"><h4>Situação financeira</h4>
        ${donut([{valor:f.recebido, cor:'#12965d', curto:'recebido'},
                 {valor:Math.max(f.contratado-f.recebido,0), cor:'#e6e9ee', curto:''}], 140, 19)}
        <div class="legend"><span><i class="swatch" style="background:#12965d"></i>Recebido ${cash0(f.recebido)}</span>
          <span><i class="swatch" style="background:#e6e9ee"></i>Em falta ${cash0(Math.max(f.contratado-f.recebido,0))}</span></div>
      </div>
    </div>
    <p style="margin-top:12px">O projeto apresenta uma execução de <strong>${pc(prog)}</strong>,
    com <strong>${concl}</strong> de <strong>${ts.length}</strong> tarefas concluídas e
    <strong>${atrasadas}</strong> tarefa(s) em atraso.
    ${z.atrasado ? `O prazo de fim está <strong class="neg">${Math.abs(z.dias)} dia(s) ultrapassado</strong>.`
     : z.dias !== null ? `Faltam <strong>${z.dias} dia(s)</strong> para o fim previsto.` : ''}
    ${z.desvio ? `Face à baseline, o prazo apresenta um desvio de <strong>${z.desvio > 0 ? '+' : ''}${z.desvio} dia(s)</strong>.` : ''}</p>

    <h3>3. Situação financeira</h3>
    <table>
      <thead><tr><th>Indicador</th><th class="num">Valor</th></tr></thead>
      <tbody>
        <tr><td>Valor contratado</td><td class="num">${cash(f.contratado)}</td></tr>
        <tr><td>Recebido (pago)</td><td class="num pago">${cash(f.recebido)}</td></tr>
        <tr><td>Em falta / a receber</td><td class="num falta">${cash(f.aReceber)}</td></tr>
        <tr><td><strong>Percentagem já paga</strong></td><td class="num"><strong>${pc(f.pagoPct)}</strong></td></tr>
        <tr><td>Pago a fornecedores</td><td class="num">${cash(f.pago)}</td></tr>
        <tr><td>Saldo de tesouraria</td><td class="num ${f.saldo<0?'neg':''}">${cash(f.saldo)}</td></tr>
        <tr><td>Custo previsto das tarefas</td><td class="num">${cash(f.custoPrev)}</td></tr>
        <tr><td>— já pago</td><td class="num pago">${cash(f.custoPago)}</td></tr>
        <tr><td>— em falta</td><td class="num falta">${cash(f.custoFalta)}</td></tr>
      </tbody>
    </table>

    <h3>4. Execução por tarefa</h3>
    <table>
      <thead><tr><th>Tarefa</th><th>Responsável</th><th>Fim</th>
        <th class="num">Afetação</th><th class="num">Progresso</th>
        <th class="num">Custo</th><th class="num">Pago</th><th class="num">Em falta</th></tr></thead>
      <tbody>
        ${ts.map(t => `<tr>
          <td>${esc(t.nome)}</td><td>${esc(t.resp || '–')}</td>
          <td>${dpt(t.fim)}${daysBetween(iso(0), t.fim) < 0 && t.estado !== 'Concluída'
            ? ' <span class="neg">⚠</span>' : ''}</td>
          <td class="num">${pc(t.afetacao)}</td><td class="num">${pc(t.progresso)}</td>
          <td class="num">${cash0(t.custo)}</td><td class="num">${cash0(t.pago)}</td>
          <td class="num">${cash0(t.falta)}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr style="font-weight:700">
        <td colspan="3">Total</td>
        <td class="num">${pc(ts.reduce((s,t)=>s+n(t.afetacao),0))}</td><td class="num">${pc(prog)}</td>
        <td class="num">${cash0(f.custoPrev)}</td><td class="num">${cash0(f.custoPago)}</td>
        <td class="num">${cash0(f.custoFalta)}</td></tr></tfoot>
    </table>

    <h3>5. Movimentos financeiros</h3>
    <table>
      <thead><tr><th>Data</th><th>Direção</th><th>Descrição</th><th>Estado</th>
        <th class="num">Valor</th></tr></thead>
      <tbody>
        ${f.movimentos.slice().sort((a,b) => a.data.localeCompare(b.data)).map(m => `<tr>
          <td>${dpt(m.data)}</td><td>${m.dir === 'recebido' ? 'Recebido' : 'Pago'}</td>
          <td>${esc(m.desc)}</td><td>${esc(m.estado)}</td>
          <td class="num">${cash(m.valor)}</td></tr>`).join('') ||
          `<tr><td colspan="5">Sem movimentos registados.</td></tr>`}
      </tbody>
    </table>

    ${p.descricao ? `<h3>6. Âmbito do projeto</h3><p>${esc(p.descricao)}</p>` : ''}

    <p class="muted tiny" style="margin-top:22px;border-top:1px solid var(--line2);padding-top:10px">
      Relatório gerado automaticamente pelo dashboard de Gestão de Projetos e Atividades
      a partir dos dados inseridos em ${new Date().toLocaleDateString('pt-PT')}.</p>
  </div>`;
}

/* ============================== CRUD PROJETOS ============================== */
function novoProjeto() { abrirProjeto(null); }
function editarProjeto(id) { abrirProjeto(DB.projects.find(p => p.id === id)); }

function abrirProjeto(p) {
  document.getElementById('tProj').textContent = p ? 'Editar projeto' : 'Novo projeto';
  document.getElementById('p-id').value = p?.id ?? '';
  document.getElementById('p-nome').value = p?.nome ?? '';
  document.getElementById('p-tipo').value = p?.tipo ?? '';
  document.getElementById('p-gestor').value = p?.gestor ?? '';
  document.getElementById('p-estado').value = p?.estado ?? 'A iniciar';
  document.getElementById('p-prio').value = p?.prioridade ?? 'Média';
  document.getElementById('p-ini').value = p?.inicio ?? iso(0);
  document.getElementById('p-bas').value = p?.baseline ?? iso(60);
  document.getElementById('p-fim').value = p?.fim ?? iso(60);
  document.getElementById('p-contratado').value = p?.contratado ?? 0;
  document.getElementById('p-recebido').value = p?.recebido ?? 0;
  document.getElementById('p-pago').value = p?.pago ?? 0;
  document.getElementById('p-desc').value = p?.descricao ?? '';
  atualizarTipos();
  document.getElementById('dlgProj').showModal();
}
function atualizarTipos() {
  const tipos = [...new Set(DB.projects.map(p => p.tipo).filter(Boolean))];
  document.getElementById('tipos').innerHTML = tipos.map(t => `<option value="${esc(t)}">`).join('');
}
function guardarProjeto(ev) {
  ev.preventDefault();
  const id = document.getElementById('p-id').value;
  const rec = {
    id: id || uid(),
    nome: document.getElementById('p-nome').value.trim(),
    tipo: document.getElementById('p-tipo').value.trim(),
    gestor: document.getElementById('p-gestor').value.trim(),
    estado: document.getElementById('p-estado').value,
    prioridade: document.getElementById('p-prio').value,
    inicio: document.getElementById('p-ini').value,
    baseline: document.getElementById('p-bas').value,
    fim: document.getElementById('p-fim').value,
    contratado: n(document.getElementById('p-contratado').value),
    recebido: n(document.getElementById('p-recebido').value),
    pago: n(document.getElementById('p-pago').value),
    descricao: document.getElementById('p-desc').value.trim()
  };
  if (id) { const i = DB.projects.findIndex(p => p.id === id); if (i > -1) DB.projects[i] = rec; }
  else DB.projects.push(rec);
  save(); document.getElementById('dlgProj').close();
  if (!id) go('projeto', rec.id, 'tarefas'); else render();
}
function apagarProjeto(id) {
  const p = DB.projects.find(x => x.id === id);
  if (!confirm(`Apagar "${p.nome}" e todas as suas tarefas e movimentos?`)) return;
  DB.projects = DB.projects.filter(x => x.id !== id);
  DB.tasks = DB.tasks.filter(t => t.projId !== id);
  DB.payments = DB.payments.filter(m => m.projId !== id);
  save();
  if (ROUTE.projectId === id) go('portfolio'); else render();
}

/* ============================== CRUD TAREFAS ============================== */
function abrirTarefa(id, projId) {
  const t = id ? DB.tasks.find(x => x.id === id) : null;
  document.getElementById('tTask').textContent = t ? 'Editar tarefa' : 'Nova tarefa';
  document.getElementById('t-id').value = t?.id ?? '';
  document.getElementById('t-proj').value = t?.projId ?? projId;
  document.getElementById('t-nome').value = t?.nome ?? '';
  document.getElementById('t-autor').value = t?.autor ?? '';
  document.getElementById('t-resp').value = t?.resp ?? '';
  document.getElementById('t-afet').value = t?.afetacao ?? 10;
  document.getElementById('t-ini').value = t?.inicio ?? iso(0);
  document.getElementById('t-fim').value = t?.fim ?? iso(15);
  document.getElementById('t-bas').value = t?.baseline ?? iso(15);
  document.getElementById('t-estado').value = t?.estado ?? 'Por fazer';
  document.getElementById('t-prog').value = t?.progresso ?? 0;
  document.getElementById('t-alerta').value = t?.alerta ?? 7;
  document.getElementById('t-custo').value = t?.custo ?? 0;
  document.getElementById('t-pago').value = t?.pago ?? 0;
  document.getElementById('t-falta').value = t?.falta ?? 0;
  document.getElementById('t-notas').value = t?.notas ?? '';
  document.getElementById('dlgTask').showModal();
}
function editarTarefa(id) { abrirTarefa(id); }
function guardarTarefa(ev) {
  ev.preventDefault();
  const id = document.getElementById('t-id').value;
  const rec = {
    id: id || uid(),
    projId: document.getElementById('t-proj').value,
    nome: document.getElementById('t-nome').value.trim(),
    autor: document.getElementById('t-autor').value.trim(),
    resp: document.getElementById('t-resp').value.trim(),
    afetacao: n(document.getElementById('t-afet').value),
    inicio: document.getElementById('t-ini').value,
    fim: document.getElementById('t-fim').value,
    baseline: document.getElementById('t-bas').value,
    estado: document.getElementById('t-estado').value,
    progresso: Math.min(100, Math.max(0, n(document.getElementById('t-prog').value))),
    alerta: n(document.getElementById('t-alerta').value),
    custo: n(document.getElementById('t-custo').value),
    pago: n(document.getElementById('t-pago').value),
    falta: n(document.getElementById('t-falta').value),
    notas: document.getElementById('t-notas').value.trim()
  };
  if (id) { const i = DB.tasks.findIndex(x => x.id === id); if (i > -1) DB.tasks[i] = rec; }
  else DB.tasks.push(rec);
  save(); document.getElementById('dlgTask').close(); render();
}
function apagarTarefa(id) {
  const t = DB.tasks.find(x => x.id === id);
  if (!confirm(`Apagar a tarefa "${t.nome}"?`)) return;
  DB.tasks = DB.tasks.filter(x => x.id !== id);
  save(); render();
}

/* ============================== CRUD PAGAMENTOS ============================== */
function abrirPagamento(projId, id) {
  const m = id ? DB.payments.find(x => x.id === id) : null;
  document.getElementById('tPag').textContent = m ? 'Editar movimento' : 'Novo movimento';
  document.getElementById('g-id').value = m?.id ?? '';
  document.getElementById('g-proj').value = m?.projId ?? projId;
  document.getElementById('g-dir').value = m?.dir ?? 'recebido';
  document.getElementById('g-data').value = m?.data ?? iso(0);
  document.getElementById('g-valor').value = m?.valor ?? 0;
  document.getElementById('g-desc').value = m?.desc ?? '';
  document.getElementById('g-estado').value = m?.estado ?? 'Pago';
  document.getElementById('dlgPag').showModal();
}
function editarPagamento(id) { abrirPagamento(null, id); }
function guardarPagamento(ev) {
  ev.preventDefault();
  const id = document.getElementById('g-id').value;
  const rec = {
    id: id || uid(),
    projId: document.getElementById('g-proj').value,
    dir: document.getElementById('g-dir').value,
    data: document.getElementById('g-data').value,
    valor: n(document.getElementById('g-valor').value),
    desc: document.getElementById('g-desc').value.trim() || '(sem descrição)',
    estado: document.getElementById('g-estado').value
  };
  if (id) { const i = DB.payments.findIndex(x => x.id === id); if (i > -1) DB.payments[i] = rec; }
  else DB.payments.push(rec);
  save(); document.getElementById('dlgPag').close(); render();
}
function apagarPagamento(id) {
  if (!confirm('Apagar este movimento?')) return;
  DB.payments = DB.payments.filter(x => x.id !== id);
  save(); render();
}

/* ============================== IMPORTAR / EXPORTAR ============================== */
function exportar() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gestao-projetos-' + iso(0) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importar(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.projects) throw new Error('falta a lista de projetos');
      DB = { projects: data.projects, tasks: data.tasks || [], payments: data.payments || [] };
      save(); go('portfolio');
    } catch(e) { alert('Ficheiro inválido: ' + e.message); }
  };
  reader.readAsText(file); input.value = '';
}

/* ============================== ARRANQUE ============================== */
load();
atualizarTipos();
render();
</script>
</body>
</html>
